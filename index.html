<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a09" id="themeColorMeta">
<meta name="description" content="Mihrab — A personal operating system for building a meaningful, independent life.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mihrab">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/mihrab-logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<title>Mihrab — Enter your sanctuary. Build yourself. Create impact.</title>
<link rel="stylesheet" href="./styles.css?v=38.0">
</head>
<body data-theme="mono">
<div class="entry-threshold" id="entryThreshold" aria-hidden="true">
  <div class="entry-cosmos"></div>
  <div class="entry-geometry" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="entry-portal">
    <div class="entry-aura"></div>
    <div class="entry-ring ring-1"></div><div class="entry-ring ring-2"></div><div class="entry-ring ring-3"></div>
    <div class="entry-arch">
      <div class="entry-opening"><div class="entry-depth"></div></div>
      <div class="entry-brand">
        <div class="mihrab-mark entry-mark"><svg viewBox="0 0 52 52"><path class="mark-outer" d="M10 40V23c0-7.2 6-13 13.4-13h5.2C35 6 41 11.8 41 19v21"/><path class="mark-inner" d="M17 40V21.2C17 16.1 21 12 26 12s9 4.1 9 9.2V40"/><path class="mark-floor" d="M9 40h33"/><circle class="mark-dot" cx="26" cy="7.5" r="1.65"/></svg></div>
        <strong>مِحْرَاب</strong><span>M I H R A B</span>
      </div>
    </div>
  </div>
  <div class="entry-copy">
    <span class="entry-kicker">A PRIVATE DIGITAL SANCTUARY</span>
    <h1>ادخل <em>مِحْرَاب</em></h1>
    <p>مكان هادئ ترتّب فيه يومك، تبني نفسك، وتصنع الأثر.</p>
  </div>
  <button class="entry-enter" id="entryEnter" onclick="enterMihrab()"><span>دخول</span><i>↘</i></button>
  <button class="entry-skip" onclick="enterMihrab(true)">تخطي المقدمة</button>
</div>
<div class="app">
<header class="topbar">
  <div class="brand-cluster" aria-label="Mihrab">
    <div class="mihrab-mark" aria-hidden="true"><svg viewBox="0 0 52 52"><path class="mark-outer" d="M10 40V23c0-7.2 6-13 13.4-13h5.2C35 6 41 11.8 41 19v21"/><path class="mark-inner" d="M17 40V21.2C17 16.1 21 12 26 12s9 4.1 9 9.2V40"/><path class="mark-floor" d="M9 40h33"/><circle class="mark-dot" cx="26" cy="7.5" r="1.65"/></svg></div>
    <div class="brand-copy"><div class="brand-ar">مِحْرَاب</div><div class="brand-en">Mihrab</div><small id="brandTagline">بناء النفس، وصناعة الأثر، وتحقيق الاستقلال.</small></div>
  </div>
  <nav class="top-nav" id="nav" aria-label="Primary navigation"></nav>
  <div class="top-actions">
    <span class="online-dot" id="mihrab-online-dot" aria-label="Connection status"></span>
    <button class="icon-btn command-btn" onclick="openCommandPalette()" title="Command Palette">⌘K</button>
    <button class="icon-btn" onclick="openQuickCapture()" title="Quick Capture">＋</button>
    <button class="icon-btn" onclick="setLang(state.lang==='ar'?'en':'ar')" title="Language"><span id="langLabel">EN</span></button>
    <button class="icon-btn" onclick="cycleTheme()" title="Theme">◌</button>
    <button class="icon-btn" onclick="navigate('system')" title="System">⚙</button>
  </div>
</header>
<nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>
<main>
  <div class="view active" id="view-home"></div>
  <div class="view" id="view-execution"></div>
  <div class="view" id="view-focus"></div>
  <div class="view" id="view-progress"></div>
  <div class="view" id="view-marketing"></div>
  <div class="view" id="view-shari"></div>
  <div class="view" id="view-quran"></div>
  <div class="view" id="view-courses"></div>
  <div class="view" id="view-system"></div>
</main>
<footer>لا تعويض اندفاعي · ثبات الأساسيات · إنتاج مهني يتدرج بدون استنزاف</footer>
</div>
<script defer src="./app.js?v=38.0"></script>
</body>
</html>
