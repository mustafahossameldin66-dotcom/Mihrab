<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a09" id="themeColorMeta">
<meta name="description" content="Mihrab — A personal operating system for building a meaningful, independent life.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mihrab">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/mihrab-logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<title>Mihrab — Build Yourself. Create Impact.</title>
<link rel="stylesheet" href="./styles-v27.css">
</head>
<body data-theme="mono">
<div class="app">
<header class="topbar">
  <div class="brand-cluster" aria-label="Mihrab">
    <div class="mihrab-mark" aria-hidden="true"><svg viewBox="0 0 52 52"><path class="mark-outer" d="M10 40V23c0-7.2 6-13 13.4-13h5.2C35 6 41 11.8 41 19v21"/><path class="mark-inner" d="M17 40V21.2C17 16.1 21 12 26 12s9 4.1 9 9.2V40"/><path class="mark-floor" d="M9 40h33"/><circle class="mark-dot" cx="26" cy="7.5" r="1.65"/></svg></div>
    <div class="brand-copy"><div class="brand-ar">مِحْرَاب</div><div class="brand-en">Mihrab</div><small id="brandTagline">بناء النفس، وصناعة الأثر، وتحقيق الاستقلال.</small></div>
  </div>
  <nav class="top-nav" id="nav" aria-label="Primary navigation">
  <a class="nav-btn active" data-view="home" href="#home"><span class="nav-icon">⌂</span><span class="nav-label">مركز اليوم</span></a>
  <a class="nav-btn" data-view="marketing" href="#marketing"><span class="nav-icon">↗</span><span class="nav-label">التسويق</span></a>
  <a class="nav-btn" data-view="shari" href="#shari"><span class="nav-icon">✦</span><span class="nav-label">العلم الشرعي</span></a>
  <a class="nav-btn" data-view="quran" href="#quran"><span class="nav-icon">☾</span><span class="nav-label">القرآن</span></a>
  <a class="nav-btn" data-view="courses" href="#courses"><span class="nav-icon">▣</span><span class="nav-label">الكورسات</span></a>
  <a class="nav-btn" data-view="system" href="#system"><span class="nav-icon">◌</span><span class="nav-label">النظام</span></a>
</nav>
  <div class="top-actions">
    <span class="online-dot" id="mihrab-online-dot" aria-label="Connection status"></span>
    <button class="icon-btn command-btn" onclick="openCommandPalette()" title="Command Palette">⌘K</button>
    <button class="icon-btn" onclick="openQuickCapture()" title="Quick Capture">＋</button>
    <button class="icon-btn" onclick="setLang(state.lang==='ar'?'en':'ar')" title="Language"><span id="langLabel">EN</span></button>
    <button class="icon-btn" onclick="cycleTheme()" title="Theme">◌</button>
    <button class="icon-btn" onclick="navigate('system')" title="System">⚙</button>
  </div>
</header>
<nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
  <a class="nav-btn active" data-view="home" href="#home"><span class="nav-icon">⌂</span><span class="nav-label">مركز اليوم</span></a>
  <a class="nav-btn" data-view="marketing" href="#marketing"><span class="nav-icon">↗</span><span class="nav-label">التسويق</span></a>
  <a class="nav-btn" data-view="shari" href="#shari"><span class="nav-icon">✦</span><span class="nav-label">الشرعي</span></a>
  <a class="nav-btn" data-view="quran" href="#quran"><span class="nav-icon">☾</span><span class="nav-label">القرآن</span></a>
  <a class="nav-btn" data-view="courses" href="#courses"><span class="nav-icon">▣</span><span class="nav-label">الكورسات</span></a>
  <a class="nav-btn" data-view="system" href="#system"><span class="nav-icon">◌</span><span class="nav-label">النظام</span></a>
</nav>
<main>
  <div class="view active" id="view-home"></div>
  <div class="view" id="view-marketing"></div>
  <div class="view" id="view-shari"></div>
  <div class="view" id="view-quran"></div>
  <div class="view" id="view-courses"></div>
  <div class="view" id="view-system"></div>
</main>
<footer>لا تعويض اندفاعي · ثبات الأساسيات · إنتاج مهني يتدرج بدون استنزاف</footer>
</div>
<script defer src="./app-v27.js"></script>
</body>
</html>
