<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
  <meta name="theme-color" content="#02050a" id="themeColorMeta"/>
  <meta name="description" content="Mihrab — A personal operating system for building a meaningful, independent life. بناء النفس، وصناعة الأثر، وتحقيق الاستقلال."/>

  <!-- تحسينات PWA المضافة لأجهزة أبل (iOS) لتعمل كتطبيق أصلي (Native) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mihrab">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">

  <!-- تحسينات الأداء لتسريع معالجة الواجهة -->
  <link rel="preload" href="./styles.css?v=15.1" as="style">
  <link rel="preload" href="./app.js?v=15.1" as="script">

  <link href="manifest.webmanifest" rel="manifest"/>
  <title>Mihrab — Build Yourself. Create Impact.</title>

  <link href="./styles.css?v=15.1" rel="stylesheet"/>
  <link href="./assets/mihrab-logo.svg" rel="icon" type="image/svg+xml"/>

  <!-- التحسينات الجمالية: تأثير المهام (Notion-style) بالنور الأخضر المزرق -->
  <style>
    /* إعادة ضبط هيكل المهمة لتكون ناعمة الزوايا */
    .task-item {
      border-radius: 12px !important;
      transition: background 0.35s ease, box-shadow 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), padding 0.35s ease !important;
      border: 1px solid transparent !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.018) !important;
      overflow: visible !important; /* للسماح للظل بالظهور خارج الإطار */
    }

    /* تأثير الـ Hover: النور الأخضر المزرق */
    .task-item:hover, .task-item:focus-within {
      /* خلفية متدرجة تذوب ببطء */
      background: linear-gradient(90deg, rgba(94, 234, 212, 0.08), rgba(94, 234, 212, 0.01)) !important;
      /* خط جانبي صلب + إشعاع (Glow) أخضر مزرق ناعم */
      box-shadow: inset 3px 0 0 rgba(94, 234, 212, 0.8), 0 8px 24px rgba(94, 234, 212, 0.12) !important;
      border-color: rgba(94, 234, 212, 0.15) !important;
      transform: translateX(-4px) scale(1.005) !important;
      padding-inline: 12px !important;
      z-index: 2;
    }

    /* إطفاء التأثير القوي إذا كانت المهمة مكتملة بالفعل */
    .task-item.done:hover {
      background: rgba(255, 255, 255, 0.012) !important;
      box-shadow: inset 3px 0 0 var(--muted) !important;
      border-color: transparent !important;
      transform: translateX(-2px) !important;
    }

    /* تفاعل مربع التحديد (Checkbox) مع نفس اللون الأخضر المزرق */
    .task-item input[type="checkbox"]:hover {
      border-color: rgba(94, 234, 212, 0.8) !important;
      box-shadow: 0 0 12px rgba(94, 234, 212, 0.4) !important;
    }
  </style>
</head>
<body data-theme="aurora">
<div class="app">
<header class="topbar">
  <div class="brand-cluster" aria-label="Mihrab">
    <div class="mihrab-mark" aria-hidden="true">
      <svg viewBox="0 0 52 52" role="presentation">
        <path class="mark-outer" d="M10 40V19c0-7.2 6-13 13.4-13h5.2C35 6 41 11.8 41 19v21"/>
        <path class="mark-inner" d="M17 40V21.2C17 16.1 21 12 26 12s9 4.1 9 9.2V40"/>
        <path class="mark-floor" d="M9 40h33"/>
        <circle class="mark-dot" cx="26" cy="7.5" r="1.65"/>
      </svg>
    </div>
    <div class="brand-copy">
      <div class="brand-ar" dir="rtl">مِحْرَاب</div>
      <div class="brand-en">Mihrab</div>
      <small id="brandTagline">بناء النفس، وصناعة الأثر، وتحقيق الاستقلال.</small>
    </div>
  </div>
  <nav class="top-nav" id="nav" aria-label="Primary navigation"></nav>
  <div class="top-actions">
    <span class="online-dot" id="mihrab-online-dot" title="Online" aria-label="Connection status"></span>
    <button class="icon-btn command-btn" onclick="openCommandPalette()" title="Command Palette">⌘K</button>
    <button class="icon-btn quick-capture-top" onclick="openQuickCapture()" title="Quick Capture">＋</button>
    <button class="icon-btn lang-toggle" onclick="setLang(state.lang==='ar'?'en':'ar')" title="تغيير اللغة"><span id="langLabel">EN</span></button>
    <button class="icon-btn" onclick="cycleTheme()" title="تغيير الثيم">◌</button>
    <button class="icon-btn" onclick="navigate('system')" title="الإعدادات">⚙</button>
  </div>
</header>
<nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>
<main role="main">
  <div class="view active" id="view-home"></div>
  <div class="view" id="view-marketing"></div>
  <div class="view" id="view-shari"></div>
  <div class="view" id="view-quran"></div>
  <div class="view" id="view-courses"></div>
  <div class="view" id="view-system"></div>
</main>
<footer>لا تعويض اندفاعي · ثبات الأساسيات · إنتاج مهني يتدرج بدون استنزاف</footer>
</div>

<script defer src="./app.js?v=15.1"></script>
</body>
</html>
